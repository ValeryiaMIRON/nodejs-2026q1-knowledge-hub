services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledge-hub-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --spider http://localhost:4000/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: on-failure
    networks:
      - knowledge-hub-network

  db:
    image: postgres:16-alpine
    container_name: knowledge-hub-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - knowledge-hub-network

  adminer:
    image: adminer:latest
    container_name: knowledge-hub-adminer
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - debug
    restart: unless-stopped
    networks:
      - knowledge-hub-network

networks:
  knowledge-hub-network:
    driver: bridge

volumes:
  postgres-data: